<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="七子傲的个人博客，记录技术、生活、作品和长期思考。">
    <meta property="og:title" content="七子傲">
    <meta property="og:description" content="一个关于技术、生活、作品和长期思考的个人博客。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qiziaoblog.cc.cd/">
    <title>七子傲 | 个人博客</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="七子傲首页">
        <img src="/assets/logo-mark.svg" alt="" width="34" height="34">
        <span>七子傲</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="#posts">文章</a>
        <a href="#about">关于</a>
        <a href="#notes">随笔</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">QIZIAO BLOG</p>
          <h1 id="hero-title">七子傲</h1>
          <p class="hero-lede">
            一个安静、锋利、长期更新的个人博客。记录技术实践、作品构建、生活观察，以及那些值得被反复思考的问题。
          </p>
          <div class="hero-actions" aria-label="快捷操作">
            <a class="button primary" href="#posts">开始阅读</a>
            <a class="button secondary" href="#about">关于我</a>
          </div>
        </div>
        <figure class="hero-visual">
          <img src="/assets/hero-visual.svg" alt="七子傲博客的抽象玻璃质感视觉图">
        </figure>
      </section>

      <section id="posts" class="section feature-section" aria-labelledby="posts-title">
        <div class="section-heading">
          <p class="eyebrow">LATEST WRITING</p>
          <h2 id="posts-title">最新文章</h2>
        </div>
        <div id="post-list" class="post-grid"></div>
      </section>

      <section id="about" class="section split-section" aria-labelledby="about-title">
        <div>
          <p class="eyebrow">ABOUT</p>
          <h2 id="about-title">关于七子傲</h2>
        </div>
        <p>
          这里会慢慢沉淀成一个属于我的数字空间：有代码、有审美、有复盘，也有生活里突然闪出来的念头。
          网站部署在 Cloudflare Pages，轻、快、稳定，适合长期写下去。
        </p>
      </section>

      <section id="notes" class="section note-band" aria-labelledby="notes-title">
        <p class="eyebrow">SIGNAL</p>
        <h2 id="notes-title">把复杂的问题，写到清楚为止。</h2>
        <p>
          博客不追求热闹，追求可回看。每一篇文章都像给未来的自己留下一块路标。
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> 七子傲</span>
      <a href="https://qiziaoblog.cc.cd/">qiziaoblog.cc.cd</a>
    </footer>

    <script src="/assets/posts.js"></script>
    <script src="/assets/main.js"></script>
  </body>
</html>
