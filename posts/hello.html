        <p>
          这是七子傲的第一篇文章。一个博客最重要的不是一开始就完美，而是先有一个稳定、清爽、愿意长期维护的地方。

        <p>
          这个网站使用静态页面构建，部署到 Cloudflare Pages。它不依赖数据库，也不需要服务器运维，
          速度快，成本低，适合个人博客的第一阶段。

        <h2>之后可以继续做什么</h2>

          接下来可以慢慢加入文章归档、标签页、RSS、评论区、访问统计和更完整的个人介绍。
